[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tally"
version = "0.1.0"
description = "CLI REPL for orchestrating web application penetration testing"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "chromadb>=0.4.0",
    "ollama>=0.1.0",
    "anthropic>=0.50.0",
    "mcp>=1.0",
    "weasyprint",
    "jinja2>=3.0",
    "fastapi>=0.100",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyright",
    "pre-commit",
    "pytest>=7.0.0",
    "pytest-timeout>=2.0.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
extraPaths = []

[tool.coverage.run]
branch = true
source = ["application", "domain", "infrastructure", "tally_mcp", "core", "web"]
omit = ["*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
fail_under = 70

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning:chromadb",
]
markers = [
  "slow: marks tests as slow-running (nmap scans)",
  "requires_nmap: marks tests that need nmap installed",
  "requires_ollama: marks tests that need Ollama running",
  "requires_gitleaks: marks tests that need gitleaks installed",
  "integration: marks tests that require real SQLite / filesystem / ChromaDB",
  "e2e: marks tests that require external services such as Ollama or real binaries",
]
