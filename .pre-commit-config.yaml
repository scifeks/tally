repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        language: system
        entry: .venv/bin/ruff format
        types: [python]
        pass_filenames: true

      - id: ruff-check
        name: ruff check
        language: system
        entry: .venv/bin/ruff check --fix
        types: [python]
        pass_filenames: true

      - id: pyright
        name: pyright
        language: system
        entry: .venv/bin/pyright
        types: [python]
        pass_filenames: false

      - id: ui-lint-staged
        name: ui lint-staged (eslint + prettier on staged ts/tsx/json/css)
        language: system
        entry: bash -c 'cd ui && npx lint-staged'
        files: ^ui/src/.*\.(ts|tsx|json|css)$
        pass_filenames: false

      - id: ui-type-check
        name: ui type-check (tsc -b --noEmit, project-wide)
        language: system
        entry: bash -c 'cd ui && npm run --silent type-check'
        files: ^ui/(src/.*\.(ts|tsx)|tsconfig.*\.json|package(-lock)?\.json)$
        pass_filenames: false
