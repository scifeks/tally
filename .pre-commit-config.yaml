repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        language: system
        entry: .venv/bin/ruff format
        types: [python]
        pass_filenames: true

      - id: ruff-check
        name: ruff check
        language: system
        entry: .venv/bin/ruff check --fix
        types: [python]
        pass_filenames: true

      - id: pyright
        name: pyright
        language: system
        entry: .venv/bin/pyright
        types: [python]
        pass_filenames: false
